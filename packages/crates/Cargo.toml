[package]
name = "concrete-contractors-estimator"
version = "1.0.1"
edition = "2021"
rust-version = "1.70"
description = "Concrete contractors estimator: slab, footing, column and steps volume, bag counts, rebar, cost range and hot-weather pour advice"
license = "MIT"
authors = ["Phoenix Concrete Contractors"]
homepage = "https://concretecontractorsphoenix.net/"
repository = "https://github.com/nbkdevs/concrete-contractors-phoenix"
documentation = "https://docs.rs/concrete-contractors-estimator"
readme = "README.md"
keywords = ["concrete", "calculator", "construction", "estimator", "rebar"]
categories = ["command-line-utilities", "mathematics"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[lib]
name = "concrete_contractors_estimator"

[[bin]]
name = "concrete-contractors-estimator"
path = "src/bin/cli.rs"
